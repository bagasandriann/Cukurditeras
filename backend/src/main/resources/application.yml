spring:
  application:
    name: cukur-di-teras-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cukur_di_teras}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Jakarta
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  timezone: Asia/Jakarta
  jwt:
    secret: ${JWT_SECRET:dev-secret-minimal-32-characters-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    cookie-name: ${JWT_COOKIE_NAME:capster_session}
